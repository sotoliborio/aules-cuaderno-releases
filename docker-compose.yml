name: cuaderno-aules
services:
  cuaderno:
    image: cuaderno-aules:0.2.3
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - cuaderno-aules-data:/data
    environment:
      AULES_TAILSCALE_ORIGIN: ${AULES_TAILSCALE_ORIGIN:-}
      AULES_TAILSCALE_USER: ${AULES_TAILSCALE_USER:-}
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    shm_size: 512mb
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  cuaderno-aules-data:
