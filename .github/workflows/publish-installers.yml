name: Publicar instaladores verificados
on:
  workflow_dispatch:
    inputs:
      mac_url:
        required: true
        type: string
      windows_url:
        required: true
        type: string
      mac_digest:
        required: true
        type: string
      windows_digest:
        required: true
        type: string
      manifest:
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar solo paquetes y verificar huellas
        env:
          MAC_URL: ${{ inputs.mac_url }}
          WINDOWS_URL: ${{ inputs.windows_url }}
          MAC_DIGEST: ${{ inputs.mac_digest }}
          WINDOWS_DIGEST: ${{ inputs.windows_digest }}
          MANIFEST: ${{ inputs.manifest }}
        run: |
          python3 - <<'PYTHON'
          import os,urllib.request,zipfile,io,hashlib,json
          from pathlib import Path
          folder=Path('packages');folder.mkdir()
          for system in ('MAC','WINDOWS'):
              url=os.environ[system+'_URL'];print('::add-mask::'+url,flush=True)
              with urllib.request.urlopen(url,timeout=300) as response: body=response.read()
              assert hashlib.sha256(body).hexdigest()==os.environ[system+'_DIGEST'].removeprefix('sha256:')
              with zipfile.ZipFile(io.BytesIO(body)) as archive:
                  for entry in archive.infolist():
                      if entry.is_dir():continue
                      assert '..' not in Path(entry.filename).parts
                      name=Path(entry.filename).name.replace(' ','-')
                      assert name.endswith(('.exe','.exe.sig','.app.tar.gz','.app.tar.gz.sig'))
                      assert not (folder/name).exists()
                      (folder/name).write_bytes(archive.read(entry))
          assert len(list(folder.iterdir()))==4
          manifest=json.loads(os.environ['MANIFEST']);assert manifest['version']=='0.1.0'
          for platform in manifest['platforms'].values():
              name=urllib.parse.unquote(platform['url'].rsplit('/',1)[1]);assert (folder/name).is_file()
              assert platform['signature']==(folder/(name+'.sig')).read_text().strip()
          (folder/'latest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          (folder/'SHA256SUMS.txt').write_text('\n'.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in sorted(folder.iterdir()))+'\n')
          PYTHON
      - name: Publicar la release en preparación
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.0 packages/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit v0.1.0 --draft=false --latest --repo "$GITHUB_REPOSITORY"
